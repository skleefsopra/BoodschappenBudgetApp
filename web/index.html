<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekmenu Budget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekmenu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: één kolom zoals een app, tabbalk onderaan; de boodschappenlijst leest als een kassabon. */
:root {
  --bg: #f4f6f1; --surface: #ffffff; --sunk: #e9ede4; --ink: #1d2420; --muted: #5f6b63; --line: #d5dccf;
  --accent: #2f6b4f; --accent-ink: #ffffff; --accent-soft: #dcebe2;
  --ok: #2f6b4f; --warn: #a8761c; --warn-soft: #f6ead2; --bad: #b0442e; --bad-soft: #f6dcd5;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --surface: #1c2320; --sunk: #232b27; --ink: #e6ebe6; --muted: #9aa69e; --line: #313b36;
  --accent: #7cc4a0; --accent-ink: #0f1a14; --accent-soft: #23392e;
  --ok: #7cc4a0; --warn: #e0b45a; --warn-soft: #3a3020; --bad: #ec8a74; --bad-soft: #3d2520; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --sunk: #232b27; --ink: #e6ebe6; --muted: #9aa69e; --line: #313b36;
  --accent: #7cc4a0; --accent-ink: #0f1a14; --accent-soft: #23392e;
  --ok: #7cc4a0; --warn: #e0b45a; --warn-soft: #3a3020; --bad: #ec8a74; --bad-soft: #3d2520; color-scheme: dark }

* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px) }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; padding-block: 20px 8px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 1.75rem; font-weight: 700 }
h2 { font-size: 1.25rem; font-weight: 700 }
h3 { font-size: 1rem; font-weight: 600; font-family: var(--f-body) }
p { margin: 0 }
.muted { color: var(--muted) }
.small { font-size: .85rem }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.mono, .geld { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.stack { display: grid; gap: 12px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.between { justify-content: space-between }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0 }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

button, .knop { font: 600 .95rem var(--f-body); border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); padding: 9px 16px; cursor: pointer; min-height: 40px }
button.primair { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
button.klein { padding: 4px 12px; min-height: 32px; font-size: .85rem }
button.tekst { border: 0; background: none; padding: 4px 6px; min-height: 0; color: var(--accent) }
button:disabled { opacity: .5; cursor: default }
input, select, textarea { font: 1rem var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0 }
textarea { min-height: 70px; resize: vertical }
label.veld { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 500; min-width: 0 }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.grid3 { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; align-items: end }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr } }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
  background: var(--sunk); color: var(--muted); white-space: nowrap }
.pill.ok { background: var(--accent-soft); color: var(--ok) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }

/* Kop met budgetmeter */
.kop { display: grid; gap: 10px }
.meter { height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; position: relative }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: inherit }
.meter.over > i { background: var(--bad) }

/* Winkelvergelijking */
.winkels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.winkel { text-align: left; border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-height: 0; font-weight: 400 }
.winkel[aria-pressed="true"] { border: 2px solid var(--accent); padding: 11px 13px; background: var(--accent-soft) }
.winkel .naam { font: 700 1.05rem var(--f-display) }
.winkel .bedrag { font: 500 1.35rem var(--f-mono); font-variant-numeric: tabular-nums }

/* Weekmenu */
.dag { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line) }
.dag:first-child { border-top: 0; padding-top: 2px }
.dag .wk { font: 700 .95rem var(--f-display); padding-top: 2px }
.dag .wk small { display: block; font: 400 .75rem var(--f-body); color: var(--muted) }
.maaltijden { display: grid; gap: 4px; min-width: 0 }
.maal { display: grid; grid-template-columns: 58px 1fr; gap: 8px; text-align: left; border: 0; background: none; padding: 3px 0; min-height: 0;
  font-weight: 400; border-radius: 6px; color: var(--ink) }
.maal:hover .gerecht { text-decoration: underline }
.maal .soort { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 3px }
.maal .gerecht { min-width: 0 }
.eigen-tag { color: var(--accent); font-size: .75rem; font-weight: 600; margin-left: 4px }

/* Kassabon */
.bon { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px 16px 14px;
  font-family: var(--f-mono); font-size: .88rem; position: relative }
.bon::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -7px; height: 8px;
  background: radial-gradient(circle at 6px -1px, transparent 6px, var(--surface) 6.5px) 0 0 / 12px 8px repeat-x }
.bon h2 { font-family: var(--f-mono); font-size: .95rem; text-align: center; letter-spacing: .1em; text-transform: uppercase }
.bon .streep { border-top: 1px dashed var(--line); margin: 10px 0 }
.regel { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; padding: 7px 0 }
.regel input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent) }
.regel.af .wat { text-decoration: line-through; color: var(--muted) }
.regel .wat { font-family: var(--f-body); font-size: .95rem; min-width: 0 }
.regel .wat a { color: inherit }
.regel .detail { display: block; font-family: var(--f-mono); font-size: .75rem; color: var(--muted) }
.regel .prijs { text-align: right; white-space: nowrap }
.totaal { display: flex; justify-content: space-between; font-weight: 500; padding: 3px 0 }
.totaal.groot { font-size: 1.05rem }

/* Tabbalk */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabs button { border: 0; background: none; border-radius: 10px; display: grid; justify-items: center; gap: 2px;
  font: 500 .72rem var(--f-body); color: var(--muted); padding: 6px 2px; min-height: 52px }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft) }

dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, calc(100% - 24px)); max-height: 85vh; background: var(--surface); color: var(--ink) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
dialog .binnen { padding: 18px; display: grid; gap: 12px; overflow: auto; max-height: 85vh }
.lijstje { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px }
.lijstje li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px }
.lijstje li:last-child { border-bottom: 0 }
.fout { color: var(--bad); font-size: .9rem }
.melding { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: .9rem; max-width: calc(100% - 32px) }
.bezig { display: flex; gap: 10px; align-items: center; color: var(--muted) }
.bezig::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: draai .8s linear infinite }
@keyframes draai { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .bezig::before { animation: none } }
</style>
</head>
<body>
<main id="app"><p class="bezig">Prijzen laden…</p></main>

<nav class="tabs" aria-label="Onderdelen">
  <button data-tab="week" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-tab="lijst"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Lijst</button>
  <button data-tab="recepten"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4"/></svg>Recepten</button>
  <button data-tab="prijzen"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Prijzen</button>
  <button data-tab="instellingen"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a2.5 2.5 0 1 0 0-5M17 14a5 5 0 0 1 4 6"/></svg>Huishouden</button>
</nav>

<dialog id="venster"><div class="binnen" id="venster-inhoud"></div></dialog>
<div class="melding" id="melding" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
