# Nieuwe prijzen ophalen en de app op GitHub Pages bijwerken. Start je zelf:
# tabblad Actions > "Prijzen en app bijwerken" > Run workflow.
name: Prijzen en app bijwerken

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prijzen ophalen
        run: |
          pip install pytest
          python3 bouw_prijzen.py
          python3 bouw_web.py
      - name: Testen
        run: |
          python3 -m pytest -q tests
          node --test web/tests/planner.test.mjs
      - name: Nieuwe prijzen bewaren
        run: |
          git config user.name "prijzen-bot"
          git config user.email "prijzen-bot@users.noreply.github.com"
          git add ingredientprijzen.json web/data
          git diff --cached --quiet || git commit -m "Prijzen van $(date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
